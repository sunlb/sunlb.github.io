" 基础设置
set nocompatible          " 完全禁用vi兼容模式
set encoding=utf-8        " 设置编码
set fileencodings=utf-8,gbk " 文件编码检测顺序
set backspace=indent,eol,start " 让backspace正常工作
set hidden                " 允许在未保存时切换缓冲区
" set mouse=a               " 启用鼠标支持
set ignorecase            " 搜索时忽略大小写
set smartcase             " 如果有大写字母则区分大小写
set incsearch             " 实时搜索
set showmatch             " 显示匹配的括号
set laststatus=2          " 总是显示状态栏
set ruler                 " 显示光标位置

" 语法高亮
filetype plugin indent on
syntax on
let python_highlight_all=1

" 选中高亮
set hlsearch        " 高亮搜索结果
set number          " 显示行号
set cursorline      " 高亮当前行
hi CursorLine cterm=NONE ctermbg=darkred ctermfg=white guibg=darkred guifg=white

" TAB设置
set expandtab      " 用空格代替 Tab
set tabstop=4      " Tab 在文件中占 4 个空格
set shiftwidth=4   " 自动缩进/手动缩进宽度
set softtabstop=4  " 插入/删除 Tab 时按 4 个空格计算
set autoindent


" 键盘映射
nnoremap <F4> :call Help()<CR>
inoremap <F4> <ESC>:call Help()<CR>
nnoremap <F5> :call ExecuteCurrentFile()<CR>
inoremap <F5> <ESC>:call ExecuteCurrentFile()<CR>
nnoremap <F6> :call DebugCurrentFile()<CR>
inoremap <F6> <ESC>:call DebugCurrentFile()<CR>
nnoremap <F7> :call FormatCurrentFile()<CR>
inoremap <F7> <ESC>:call FormatCurrentFile()<CR>


" 帮助
function! Help()
    echo "F4 帮助"
    echo "F5 运行，支持python/cpp/sh"
    echo "F6 调试，支持python/cpp"
    echo "F7 格式化，支持python/cpp/c/json/xml/md"
endfunction


" 运行
function! ExecuteCurrentFile()
    write  " 保存当前文件
    let filetype = &filetype  " 获取文件类型
    let filepath = expand('%:p')  " 无扩展名的完整路径

    " python
    if filetype == 'python'
        " 使用tput设置颜色，运行和结束提示用灰色
        execute '!echo -e "\033[90m[' . strftime("%T") . '] 运行 python3 ' . filepath . '\033[0m" && python3 "' . filepath . '" && echo -e "\033[90m[' . strftime("%T") . '] 结束\033[0m"'
    " c++
    elseif filetype == 'cpp'
        let output = expand('%:p:r')  " 无扩展名的完整路径
        if has('win32')
            execute '!g++ -o "' . output . '.exe" "' . filepath . '" && "' . output . '.exe"'
        else
            " 使用tput设置颜色，运行、编译和结束提示用灰色
            execute '!echo -e "\033[90m[' . strftime("%T") . '] 编译 g++ ' . filepath . ' -o ' . output . '\033[0m" && g++ -std=c++11 -o "' . output . '" "' . filepath . '" && echo -e "\033[90m[' . strftime("%T") . '] 运行 ' . output . '\033[0m" && "' . output . '" && echo -e "\033[90m[' . strftime("%T") . '] 结束\033[0m"'
        endif
    " shell
    elseif filetype == 'sh'
        execute '!echo -e "\033[90m[' . strftime("%T") . '] 运行 bash -xe ' . filepath . '\033[0m" && bash -xe "' . filepath . '" && echo -e "\033[90m[' . strftime("%T") . '] 结束\033[0m"'
    else
        echo "警告：文件类型不支持运行: " . filetype
    endif
endfunction


" 调试
function! DebugCurrentFile()
    write  " 保存当前文件
    let filetype = &filetype  " 获取文件类型
    let filepath = expand('%:p')  " 完整文件路径
    let filename = expand('%:t')  " 文件名

    " Python调试使用pdb
    if filetype == 'python'
        execute '!echo -e "\033[90mPython调试器 pdb (输入 c 继续执行，q 退出)\033[0m" && python3 -m pdb "' . filepath . '"'
    " C++调试使用lldb (Mac环境)
    elseif filetype == 'cpp'
        let output = expand('%:p:r')  " 无扩展名的完整路径
        let prompt = 'C++ 调试器 lldb 常用命令:\n• b\t设置断点\n• r\t开始执行\n• n\t下一步\n• s\t进入函数\n• p\t打印变量\n• m\t打印内存\n• bt\t打印调用栈\n• help\t更多帮助\n• quit\t退出'
        execute '!g++ -std=c++11 -g -O0 -o "' . output . '" "' . filepath . '" && echo -e "\033[90m' . prompt . '\033[0m" && lldb "' . output . '"'
    else
        echo "警告：文件类型不支持调试: " . filetype
    endif
endfunction


" 格式化
function! FormatCurrentFile()
    let filetype = &filetype  " 获取文件类型
    let filepath = expand('%:p')  " 完整文件路径
    let prompt = "格式化已覆盖原内容，请Enter后确认（提示：如果报错，不要保存，请undo恢复原内容，修改后再重试）"

    " 保存当前光标位置
    let save_cursor = getpos(".")

    " Python文件使用ruff格式化
    if filetype == 'python'
        " 检查ruff是否可用
        if executable('ruff')
            execute '%!ruff format --stdin-filename "' . filepath . '" -'
            echo prompt
        else
            echo "错误: 未找到ruff，请先安装: pip install ruff"
        endif

    " C++文件使用clang-format格式化
    elseif filetype == 'cpp' || filetype == 'c'
        " 检查clang-format是否可用
        if executable('clang-format')
            execute '%!clang-format --style="{BasedOnStyle: llvm, IndentWidth: 4}"'
            echo prompt
        else
            echo "错误: 未找到clang-format，请先安装: brew install clang-format"
        endif

    " json文件
    elseif filetype == 'json'
        execute '%!python -m json.tool'
        echo prompt

    " text文件
    elseif filetype == 'text'
        execute '%!sed -f /Users/mz/Dev/conf/replace.sed'
        echo prompt

    " markdown文件
    elseif filetype == 'markdown'
        execute '%!sed -f /Users/mz/Dev/conf/replace.sed'
        echo prompt

    " xml文件
    elseif filetype == 'xml'
        " 检查xmllint是否可用
        if executable('xmllint')
            execute '%!xmllint --format --recover - 2>/dev/null'
            echo prompt
        else
            echo "错误: 未找到xmllint，请先安装:"
            if has('win32')
                echo "Windows: 安装libxml2 (如通过choco: choco install libxml2)"
            else
                echo "Mac/Linux: brew install libxml2 或 apt-get install libxml2-utils"
            endif
        endif

    else
        echo "警告：文件类型不支持格式化: " . filetype
    endif

    " 恢复光标位置
    call setpos('.', save_cursor)
endfunction
